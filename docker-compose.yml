version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-portfolio}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-portfolio}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio_api
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-portfolio}
      NODE_ENV: development
      API_PORT: 3001
      API_HOST: http://api:3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/api
      - /app/api/node_modules
    command: npm run dev

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portfolio_web
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://api:3001
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/web
      - /app/web/node_modules
    command: npm run dev

volumes:
  postgres_data:
